version: 2
updates:
  - package-ecosystem: uv
    target-branch: dev  # main only takes release pull requests from dev
    directory: /
    schedule: { interval: weekly }
    cooldown: { default-days: 7 }
    groups:
      python: { patterns: ["*"], update-types: [minor, patch] }
  - package-ecosystem: npm
    target-branch: dev  # main only takes release pull requests from dev
    directory: /web
    schedule: { interval: weekly }
    cooldown: { default-days: 7 }
    groups:
      web: { patterns: ["*"], update-types: [minor, patch] }
  - package-ecosystem: github-actions
    target-branch: dev  # main only takes release pull requests from dev
    directory: /
    schedule: { interval: weekly }
    cooldown: { default-days: 7 }
  - package-ecosystem: docker
    target-branch: dev  # main only takes release pull requests from dev
    directory: /
    schedule: { interval: weekly }
    cooldown: { default-days: 7 }
  - package-ecosystem: docker-compose
    target-branch: dev  # main only takes release pull requests from dev
    directory: /deploy
    schedule: { interval: weekly }
    cooldown: { default-days: 7 }
    ignore:
      # A new Postgres major needs a dump and restore into a fresh volume, not just a tag bump.
      - { dependency-name: postgres, update-types: ["version-update:semver-major"] }
