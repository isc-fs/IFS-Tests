# Source of truth for ROADMAP.md.
#
# ROADMAP.md is rendered from this file and the tracking issues' state by
# .github/scripts/render_roadmap.py, and refreshed in each release pull
# request (docs/runbook.md, 2.1); the `Check ROADMAP` workflow says when it
# is stale. Do not hand-edit ROADMAP.md: the next render overwrites it.
#
# Schema:
#   title:      H1 heading shown at the top of ROADMAP.md.
#   intro:      One-paragraph description shown under the heading.
#   phases:     list of phase clusters. Each phase has a number, a title,
#               a tag applied on dev→main when every branch in the phase
#               has landed, and a list of planned feat/fix branches. Each
#               branch has a `name` (exact git branch name) and a short
#               `scope` sentence used as the commit label in the mermaid
#               diagram. Two optional phase-level fields:
#                 deferred: true  — phase is paused / not yet approved.
#                                   Every branch shows `⏸ deferred` and the
#                                   phase is left out of the diagram.
#                 note: "..."     — one-liner rendered under the phase
#                                   title in the table.
#   sidequests: off-roadmap branches kept in the table for history.
#
# Branch names in deferred phases are placeholders: the real number is
# assigned when the branch is cut (last closed issue of that type + 1).

title: IFS-Tests roadmap

intro: |
  Plan for the team's Formula Student quiz training platform. Each phase
  is a cluster of feat branches cut from `dev`; a milestone tag on `main`
  closes the phase once every branch in it has merged. Branch status
  badges (✅ / 🔄 / 🔜 / ⏸) are derived from each branch's tracking issue
  state in GitHub Issues.

  Phase 1 is the groundwork (FS-Quiz mirror, proposal). Phases 2–4 build
  the web app on the team's own server: invite + password accounts,
  practice, mock quizzes, a daily question and a leaderboard. The design
  is in `docs/architecture.md` and `docs/adr/`. Phase 5 is the launch;
  phase 6 collects deferred ideas; phases 7–10 are the fair-play rules and
  the season-1b mechanics (ADR 0010).

phases:
  - number: 1
    title: Foundations
    tag: v0.1.0
    branches:
      - name: feat/1-project-scope
        scope: README, roadmap and agent instructions for the quiz practice system
      - name: feat/2-fsquiz-client
        scope: FS-Quiz API v2 client, polite full mirror, bank stats and API reference
      - name: feat/3-team-proposal
        scope: Gamification options deck and ideas doc for the team decision

  - number: 2
    title: Platform foundation
    tag: v0.2.0
    note: "Staging live on the team server, accounts and the question bank in place"
    branches:
      - name: feat/4-platform-skeleton
        scope: ADRs, FastAPI app, Alembic, SPA shell, local compose, CI, CodeQL
      - name: feat/5-server-deploy
        scope: Hardened production compose, scheduler, backups, deploy script, Nginx snippet
      - name: feat/6-accounts-auth
        scope: Invite links, Argon2id passwords, sessions, CSRF, roles, admin users, audit
      - name: feat/7-bank-push
        scope: Bank tables, answer-key normaliser, idempotent import, mirrored images

  - number: 3
    title: Training MVP
    tag: v0.3.0
    note: "One branch per way of answering questions, then the tools around them"
    branches:
      - name: feat/8-practice
        scope: Practice by topic with server-side grading and answer reveal
      - name: feat/9-daily-question
        scope: One question per area per day, time-boxed, with streaks
      - name: feat/10-mock-quiz
        scope: Replay a real past quiz against its original clock
      - name: feat/11-admin-taxonomy
        scope: Reviewer tools for topic labels, answer keys and exclusions
      - name: feat/12-leaderboard
        scope: Season leaderboards per person, area and vertical, with opt-out
      - name: feat/13-xp-levels
        scope: XP by difficulty, streak bonus, levels and ranks, penalties that grow with level
      - name: feat/14-learning-aids
        scope: That year's rulebook and handbook on every question; formulas, reading and hints taken away level by level
      - name: feat/15-mingoquiz
        scope: The site becomes MingoQuiz (the repository keeps its name); live quiz plan

  - number: 4
    title: Team play
    tag: v0.4.0
    note: "Live quiz sessions for team meetings and vertical training (ADR 0005)"
    branches:
      - name: feat/16-live-quiz
        scope: Any TD hosts a session everyone joins with a code; sub-department tables with captains; specialists routing; rehearsal of a full past quiz; speed points; CSV export

  - number: 5
    title: Launch
    tag: v1.0.0
    branches:
      - name: feat/17-privacy-account
        scope: Privacy notice, data export and deletion, season rollover, attribution
      - name: feat/18-ranked-lp
        scope: A League-style rank with LP that goes up and down, and an account level from XP that only goes up (ADR 0007)
      - name: feat/19-documentation
        scope: Documentation that stands on its own; guides for players, reviewers, admins and hosts; developer onboarding, data model, game rules, operations calendar, handover; docs checked in CI
      - name: feat/20-launch
        scope: Load test, restore drill, launch checklist; drop the old users.xp column (ADR 0007)
      - name: feat/21-release-decisions
        scope: The decisions the board and Technical Directors take before launch, with options and recommendations

  - number: 6
    title: After launch
    tag: v1.1.0
    deferred: true
    note: "Ideas to prioritise with the team once the MVP is in use"
    branches:
      - name: feat/22-admin-totp
        scope: Second factor for admin accounts
      - name: feat/23-notion-sync
        scope: Push scores and streaks to the Notion Team Directory
      - name: feat/24-solution-bounty
        scope: Members write worked solutions, reviewers approve, XP awarded
      - name: feat/25-team-questions
        scope: Team-written questions, starting with Driverless
      - name: feat/26-rule-page-links
        scope: Download each rulebook once (polite, cached), index rule numbers to pages, link references like EV 4.7.6 to their page
      - name: feat/36-rank-open-questions
        scope: "Decide with the team (ADR 0007, open questions): demotions shown at the end of the day, double LP for a newcomer's first answers, whether repeats move LP"

  - number: 7
    title: Fair play
    tag: v2.0.0
    note: "Ships in v2.0.0. ADR 0010: the rules per mode in English and Spanish, honest boards and read-only forensics. Branch numbers 28–35 and fix/41 were assigned by the plan; 22–26 and 36 stay in phase 6 for the deferred ideas; 27 moved to phase 8"
    branches:
      - name: feat/28-fair-play-policy
        scope: Fair-play rules per mode in English and Spanish dated to season 1b, the privacy purpose and signals notice, the board caption, ADR 0010, LIA and DPIA
      - name: feat/29-integrity-report
        scope: Read-only integrity-report CLI with pseudonymous output, recusal and a two-person reveal; pure statistics with table tests
      - name: feat/30-board-accuracy
        scope: Accuracy with Wilson bounds and n beside LP on the boards; ranking order unchanged

  - number: 8
    title: Season 1b
    tag: v2.0.0
    note: "Season 1b ships as the single release v2.0.0, deployed dark: a per-player daily with results at day close, option shuffle, and the server side of the announced per-answer totals (phases 7 and 9 land in it too). One switch, IFS_RULES_1B_FROM (26 October 2026, Madrid), turns them all on at one Madrid midnight; IFS_CANARY stays off until the recall pilot (ADR 0010)"
    branches:
      - name: feat/27-daily-per-player
        scope: A daily question drawn per player from its own Madrid-midnight effective date; today's drawn set withheld from practice, mock summary, review and live picks
      - name: feat/31-daily-results-at-day-close
        scope: Daily answers recorded, graded and granted at Madrid day close (settle), so nothing leaks through /me or the rank card
      - name: feat/32-daily-option-shuffle
        scope: Option order shuffled per daily attempt, with exclusions for positional and ordered options and a reviewer toggle
      - name: feat/33-ranked-signals-server
        scope: Nullable per-answer totals on ranked attempts, uniform decoy draw behind IFS_CANARY, export and purge 90 days after season end, two-step rollout
      - name: fix/40-release-v2.0.0
        scope: "Release v2.0.0, ranked-play integrity deployed dark: version, notes, roadmap and API client"

  - number: 9
    title: Signals
    tag: v2.0.0
    note: "Ships in v2.0.0 with phase 8, from the same switch: the client sends the totals the notice already names, from a Madrid midnight set at deploy, and the report reads them"
    branches:
      - name: feat/34-ranked-signals-client
        scope: Ranked-signals hook (declared and undeclared time away, paste on typed answers, long copies) and the honest AI note on copy
      - name: feat/35-integrity-signals-and-canary
        scope: Signals as context columns and canary evidence in the integrity report

  - number: 10
    title: Contract
    tag: v2.1.0
    note: "v2.1: after v2.0.0 has run in prod with the per-player daily in effect, the shared daily goes (the contract step)"
    branches:
      - name: fix/41-drop-shared-daily
        scope: Contract step in its own release after the per-player daily is in effect; drop daily_questions, ensure_daily and the scheduler job

sidequests: []
