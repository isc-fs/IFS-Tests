name: Check ROADMAP

# Renders ROADMAP.md from .github/roadmap.yaml + GitHub issue state and says whether the committed copy is stale.
# It never pushes: `dev` only takes pull requests (.github/rulesets/dev.json), and GitHub Actions can't be on a
# ruleset's bypass list. The release pull request refreshes ROADMAP.md (docs/runbook.md, 2.1).

on:
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
    steps:
      - name: Checkout dev
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: dev

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install --quiet pyyaml==6.0.2

      - name: Render ROADMAP.md
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python3 .github/scripts/render_roadmap.py

      - name: Report whether it changed
        run: |
          if git diff --quiet -- ROADMAP.md; then
            echo "ROADMAP.md is up to date." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::notice::ROADMAP.md is stale; the next release pull request refreshes it (runbook 2.1)."
            { echo "ROADMAP.md is stale; the next release pull request refreshes it. Changes:"; echo '```diff'; git diff -- ROADMAP.md; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          fi
