[project]
name = "ifs-tests"
version = "0.1.0"
description = "Formula Student registration quiz practice, built on the FS-Quiz question bank"
authors = [{ name = "ISC Racing Team" }]
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.0",
    "argon2-cffi>=25.1.0",
    "fastapi>=0.141.1",
    "httpx>=0.27",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.15.0",
    "sqlalchemy>=2",
    "tzdata>=2026.4",
    "uvicorn[standard]>=0.53.0",
]

[project.scripts]
ifs-tests = "ifs_tests.cli:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=8",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.8",
    "testcontainers[postgres]>=4.15.0",
]

[tool.ruff]
line-length = 110
target-version = "py313"
extend-exclude = [".github"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "S"]
ignore = ["S311", "E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S603", "S605", "S607"]
"migrations/**" = ["E501"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["src", "tests"]
mypy_path = "src"
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["ifs_tests.bank.*", "ifs_tests.cli"]
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false

[[tool.mypy.overrides]]
module = ["testcontainers.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: needs Docker (Postgres via testcontainers)"]
