[project]
name = "ifs-tests"
version = "0.1.0"
description = "Formula Student registration quiz practice, built on the FS-Quiz question bank"
authors = [{ name = "ISC Racing Team" }]
requires-python = ">=3.12"
dependencies = ["httpx>=0.27"]

[project.scripts]
ifs-tests = "ifs_tests.cli:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8",
]
