# Production and staging stack on the team server. Run through deploy.sh, which supplies IMAGE_TAG
# and the environment file (/srv/quiz/<env>/.env, see env.example).
name: quiz-${QUIZ_ENV:?set QUIZ_ENV}

x-logging: &logging
  driver: json-file
  options: { max-size: "10m", max-file: "3" }

services:
  api:
    image: ghcr.io/isc-fs/ifs-tests:${IMAGE_TAG:?set IMAGE_TAG}
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    mem_limit: 512m
    cpus: 1.0
    logging: *logging
    environment:
      IFS_ENV: ${QUIZ_ENV}
      IFS_DATABASE_URL: postgresql+psycopg://app_rt:${APP_PASSWORD:?}@db:5432/quiz
      IFS_PUBLIC_ORIGIN: https://${QUIZ_HOST:?}
    volumes:
      - media:/data/media
    networks:
      internal: {}
      proxy:
        aliases: ["quiz-${QUIZ_ENV}-api"]
    depends_on:
      db: { condition: service_healthy }

  scheduler:
    image: ghcr.io/isc-fs/ifs-tests:${IMAGE_TAG:?set IMAGE_TAG}
    command: ["ifs-tests", "scheduler"]
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    mem_limit: 256m
    cpus: 0.5
    logging: *logging
    healthcheck:
      disable: true
    environment:
      IFS_ENV: ${QUIZ_ENV}
      IFS_DATABASE_URL: postgresql+psycopg://app_rt:${APP_PASSWORD:?}@db:5432/quiz
      IFS_PUBLIC_ORIGIN: https://${QUIZ_HOST:?}
    networks: [internal]
    depends_on:
      db: { condition: service_healthy }

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    # The entrypoint needs these to fix volume ownership and drop to the postgres user.
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    mem_limit: 768m
    cpus: 1.0
    logging: *logging
    command: ["postgres", "-c", "shared_buffers=128MB", "-c", "max_connections=40", "-c", "timezone=UTC"]
    environment:
      POSTGRES_DB: quiz
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      MIGRATOR_PASSWORD: ${MIGRATOR_PASSWORD:?}
      APP_PASSWORD: ${APP_PASSWORD:?}
      BACKUP_PASSWORD: ${BACKUP_PASSWORD:?}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init-roles.sh:/docker-entrypoint-initdb.d/10-roles.sh:ro
      - ./db/roles.sql:/quiz/roles.sql:ro
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d quiz"]
      interval: 5s
      retries: 12

  backup:
    image: postgres:17-alpine
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/quiz/backup.sh"]
    read_only: true
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    mem_limit: 256m
    logging: *logging
    environment:
      TZ: Europe/Madrid
      PGHOST: db
      PGDATABASE: quiz
      PGUSER: backup_ro
      PGPASSWORD: ${BACKUP_PASSWORD:?}
      BACKUP_AT: "02:30"
      KEEP_DAYS: "14"
      HEARTBEAT_URL: ${BACKUP_HEARTBEAT_URL:-}
    volumes:
      - ./db/backup.sh:/quiz/backup.sh:ro
      - backups:/backups
    networks: [internal]
    depends_on:
      db: { condition: service_healthy }

networks:
  internal:
    internal: true
  proxy:
    external: true
    name: ${PROXY_NETWORK:-proxy}

volumes:
  pgdata:
  media:
  backups:
