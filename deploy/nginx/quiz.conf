# Quiz app server blocks for the shared Nginx container on the team server.
# Nginx must be attached to the `proxy` Docker network, where the api containers are reachable as
# quiz-prod-api and quiz-staging-api. Certificates are issued with certbot for both hostnames.

resolver 127.0.0.11 valid=10s ipv6=off;
limit_req_zone $binary_remote_addr zone=quiz_auth:10m rate=10r/m;
limit_conn_zone $binary_remote_addr zone=quiz_conn:10m;

map $host $quiz_upstream {
    quiz.iscracingteam.com          quiz-prod-api;
    quiz-staging.iscracingteam.com  quiz-staging-api;
}

server {
    listen 80;
    listen [::]:80;
    server_name quiz.iscracingteam.com quiz-staging.iscracingteam.com;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name quiz.iscracingteam.com quiz-staging.iscracingteam.com;

    ssl_certificate     /etc/letsencrypt/live/quiz.iscracingteam.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/quiz.iscracingteam.com/privkey.pem;

    # The app sets CSP and the other security headers; HSTS belongs to the TLS terminator.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    client_max_body_size 64k;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    # Overwrite, don't append: a client-supplied X-Forwarded-For must not reach the app.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;

    # Sign-in, registration and password endpoints: slow down guessing, cap parallel hashing.
    location ~ ^/(auth/|api/me/(password|delete)) {
        limit_req zone=quiz_auth burst=5;
        limit_req_status 429;
        limit_conn quiz_conn 4;
        proxy_pass http://$quiz_upstream:8000;
    }

    # One person can't tie up the app: a live quiz screen needs 2 connections (its event stream and a fetch).
    location /api/ {
        limit_conn quiz_conn 12;
        proxy_pass http://$quiz_upstream:8000;
    }

    location / {
        proxy_pass http://$quiz_upstream:8000;
    }
}
