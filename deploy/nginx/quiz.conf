# Quiz app server blocks for the shared Nginx container on the team server.
# Nginx must be attached to the `proxy` Docker network, where the api containers are reachable as
# quiz-prod-api and quiz-staging-api. Certificates are issued with certbot for both hostnames.
#
# Limits are per client IP, and a team meeting on campus Wi-Fi reaches us from one public IP: they are
# sized for the whole team (40-80 people) in one room, not for one person.

resolver 127.0.0.11 valid=10s ipv6=off;
limit_req_zone $binary_remote_addr zone=quiz_auth:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=quiz_signup:10m rate=60r/m;
limit_conn_zone $binary_remote_addr zone=quiz_conn:10m;
limit_conn_zone $binary_remote_addr zone=quiz_stream:10m;

map $host $quiz_upstream {
    quiz.iscracingteam.com          quiz-prod-api;
    quiz-staging.iscracingteam.com  quiz-staging-api;
}

server {
    listen 80;
    listen [::]:80;
    server_name quiz.iscracingteam.com quiz-staging.iscracingteam.com;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name quiz.iscracingteam.com quiz-staging.iscracingteam.com;

    ssl_certificate     /etc/letsencrypt/live/quiz.iscracingteam.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/quiz.iscracingteam.com/privkey.pem;

    # The app sets CSP and the other security headers; HSTS belongs to the TLS terminator.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    server_tokens off;
    client_max_body_size 64k;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    # Overwrite, don't append: a client-supplied X-Forwarded-For must not reach the app.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;

    # Signing up with an invite (two requests each: the invite, then the account): a room joining at a meeting
    # must fit in the burst, and it never counts against sign-ins. Invite and reset tokens can't be guessed.
    location ~ ^/auth/(invites/lookup|register)$ {
        limit_req zone=quiz_signup burst=180 nodelay;
        limit_req_status 429;
        proxy_pass http://$quiz_upstream:8000;
    }

    # Sign-in and password endpoints: slow down guessing. The burst lets a whole room sign in at once; guessing
    # one account's password is stopped by the app, which locks it for 15 minutes after 5 wrong tries
    # (domain/accounts.py), and the app caps parallel hashing itself (two threads, 503 when queued).
    location ~ ^/(auth/|api/me/(password|delete|export)) {
        limit_req zone=quiz_auth burst=80 nodelay;
        limit_req_status 429;
        proxy_pass http://$quiz_upstream:8000;
    }

    # Live quiz event streams (Server-Sent Events): every screen holds one open for the whole quiz, so they get
    # their own count, 2 per person (a phone and a laptop) for 80 people. Sent to the browser as they come.
    location ~ ^/api/live/sessions/[^/]+/events$ {
        limit_conn quiz_stream 160;
        proxy_buffering off;
        proxy_pass http://$quiz_upstream:8000;
    }

    # Requests in flight: 2 per person (a state fetch and an answer) for 80 people, so one client still
    # can't tie up the app.
    location /api/ {
        limit_conn quiz_conn 160;
        proxy_pass http://$quiz_upstream:8000;
    }

    location / {
        proxy_pass http://$quiz_upstream:8000;
    }
}
